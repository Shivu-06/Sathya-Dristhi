<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to SatyaDrishti — BBMP civic grievance verification platform for citizens and investigators.">

</head>

            <path d="M42 100C57 75 80 60 110 60C140 60 163 75 178 100C163 125 140 140 110 140C80 140 57 125 42 100Z" fill="none" stroke="#eff7ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

        <span>SatyaDrishti</span>
        <span class="brand-tag">CIVIC ACCESS</span>
      </a>
      <div class="nav-actions">
        <a href="/" class="btn btn-secondary btn-sm">← Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="container auth-container">
    <div class="glass-card auth-card">

      <div class="auth-header">
        <div class="auth-icon">🔐</div>
        <h1 class="auth-title">Portal Sign In</h1>
        <p class="auth-subtitle">
          Authenticate with your verified Citizen or BBMP Investigator credentials
        </p>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div class="demo-box">
        <div class="demo-box-title">⚡ 1-Click Quick Demo Sign In</div>
        <div class="demo-btn-group">
          <button type="button" class="btn btn-secondary btn-sm" id="btnDemoCitizen">
            👤 Citizen: Ramesh Kumar (Domlur)
          </button>
          <button type="button" class="btn btn-bbmp btn-sm" id="btnDemoInvestigator">
            🛡️ BBMP Investigator: Officer Priya
          </button>
        </div>
      </div>

      <div id="loginAlert" class="alert-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary w-full mt-1" id="loginSubmitBtn">
          Sign In to Workspace
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register as Citizen</a>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container mb-0">
      <p class="color-dim">SatyaDrishti &bull; Civic Verification Platform &bull; BBMP Operations</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('btnDemoCitizen').addEventListener('click', () => {
      document.getElementById('loginEmail').value = 'citizen@bbmp.gov.in';
      document.getElementById('loginPassword').value = 'password123';
      showNotice('Citizen credentials filled. Click "Sign In" or press Enter.');
    });

    document.getElementById('btnDemoInvestigator').addEventListener('click', () => {
      document.getElementById('loginEmail').value = 'investigator@bbmp.gov.in';
      document.getElementById('loginPassword').value = 'admin123';
      showNotice('Investigator credentials filled. Click "Sign In" or press Enter.');
    });

    function showNotice(msg) {
      const alertBox = document.getElementById('loginAlert');
      alertBox.style.display = 'block';
      alertBox.style.background = 'rgba(99, 102, 241, 0.15)';
      alertBox.style.color = '#a5b4fc';
      alertBox.style.border = '1px solid rgba(99, 102, 241, 0.3)';
      alertBox.innerText = msg;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('loginSubmitBtn');
      const alertBox = document.getElementById('loginAlert');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.color = '#34d399';
          alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
          alertBox.innerText = 'Login successful! Redirecting...';

          setTimeout(() => {
            if (data.user && data.user.role === 'investigator') {
              window.location.href = '/investigator';
            } else {
              window.location.href = '/dashboard';
            }
          }, 600);
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.color = '#f87171';
          alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
          alertBox.innerText = data.error || 'Failed to sign in.';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Sign In to Workspace';
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.color = '#f87171';
        alertBox.innerText = 'Network connection error.';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In to Workspace';
      }
    });
  </script>
</body>
</html>
